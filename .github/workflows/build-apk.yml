name: Build StudyFlow APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyFlow-Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Extract StudyFlow source ZIP
        run: |
          test -f StudyFlow-Source.zip
          mkdir -p source
          unzip -q StudyFlow-Source.zip -d source
          echo "Extracted project files:"
          find source -maxdepth 3 -type f | sort | head -100

      - name: Build debug APK
        working-directory: source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
